<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>403 접근 거부 - First Portfolio</title>

        <!-- [6주차 제공] 403 에러 페이지 : templates/error/403.html 은 스프링 부트가 자동으로 사용한다. -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
        <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
        <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
        <link th:href="@{/css/templatemo-first-portfolio-style.css}" rel="stylesheet">

        <style>
            .auth-page {
                min-height: 100vh;
                background: linear-gradient(135deg, var(--primary-color) 0%, #3d4580 100%);
                padding: 48px 16px;
            }
            .auth-card {
                background: var(--white-color);
                border-radius: var(--border-radius-medium);
                box-shadow: 0 1rem 3rem rgba(0, 0, 0, .2);
                max-width: 480px;
                width: 100%;
                padding: 40px 36px;
            }
            .error-code { font-size: 64px; font-weight: var(--font-weight-bold); color: #e05260; line-height: 1; }
            .auth-icon {
                width: 72px; height: 72px; line-height: 72px;
                border-radius: 50%;
                background: #e05260;
                color: var(--white-color);
                font-size: 32px;
                text-align: center;
            }
            .custom-btn { border: 0; }
        </style>
    </head>

    <body>
        <main class="auth-page d-flex justify-content-center align-items-center">
            <div class="auth-card text-center">
                <div class="d-inline-block auth-icon mb-3"><i class="bi-shield-exclamation"></i></div>
                <div class="error-code mb-2">403</div>
                <h4 class="mb-2">접근 권한이 없습니다</h4>
                <p class="text-muted mb-4">
                    로그인은 되어 있지만, 이 페이지를 볼 수 있는 <strong>권한(ROLE)</strong>이 없습니다.<br>
                    인증(Authentication)은 성공, 인가(Authorization)는 실패!
                </p>

                <!-- 현재 사용자와 권한 표시 -->
                <div sec:authorize="isAuthenticated()" class="alert alert-light border py-2 mb-4 text-start">
                    <div><i class="bi-person-circle me-1"></i>아이디 : <strong sec:authentication="name">student1</strong></div>
                    <div><i class="bi-key me-1"></i>내 권한 : <code sec:authentication="principal.authorities">[ROLE_USER]</code></div>
                    <div th:if="${path}"><i class="bi-link-45deg me-1"></i>요청 주소 : <code th:text="${path}">/admin/members</code></div>
                </div>

                <div class="d-flex gap-2">
                    <a th:href="@{/}" class="custom-btn btn flex-fill"><i class="bi-house me-1"></i>메인으로</a>
                    <a sec:authorize="isAuthenticated()" th:href="@{/mypage}"
                       class="btn btn-outline-secondary flex-fill d-flex align-items-center justify-content-center"
                       style="border-radius: var(--border-radius-large);"><i class="bi-person-vcard me-1"></i>내 정보</a>
                </div>
            </div>
        </main>
    </body>
</html>
