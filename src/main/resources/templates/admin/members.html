<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>회원 관리 - 관리자</title>

        <!-- [6주차 제공] 포트폴리오와 같은 부트스트랩/테마 CSS 사용 -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
        <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
        <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
        <link th:href="@{/css/templatemo-first-portfolio-style.css}" rel="stylesheet">

        <style>
            body { background: #f4f6fb; }
            .admin-header {
                background: linear-gradient(135deg, var(--primary-color) 0%, #3d4580 100%);
                color: var(--white-color);
                padding: 28px 0 88px;
            }
            .admin-header h1 { color: var(--white-color); font-size: var(--h3-font-size); margin: 0; }
            .admin-header a { color: rgba(255, 255, 255, .85); }
            .admin-header a:hover { color: var(--white-color); }
            .admin-body { margin-top: -64px; padding-bottom: 48px; }
            .admin-card {
                background: var(--white-color);
                border-radius: var(--border-radius-medium);
                box-shadow: 0 .5rem 2rem rgba(0, 0, 0, .08);
                padding: 24px;
            }
            .stat-card { display: flex; align-items: center; gap: 16px; }
            .stat-icon {
                width: 52px; height: 52px; line-height: 52px; border-radius: 50%;
                text-align: center; font-size: 24px; color: var(--white-color);
            }
            .stat-num { font-size: var(--h4-font-size); font-weight: var(--font-weight-bold); color: var(--dark-color); line-height: 1.2; }
            .stat-label { color: var(--p-color); font-size: var(--copyright-font-size); }
            .table th { color: var(--p-color); font-weight: var(--font-weight-medium); font-size: var(--copyright-font-size); white-space: nowrap; }
            .table td { vertical-align: middle; }
            .role-badge { font-size: 12px; font-weight: var(--font-weight-bold); padding: 4px 10px; border-radius: 20px; color: var(--white-color); }
            .role-ADMIN   { background: #e05260; }
            .role-MANAGER { background: #f0a030; }
            .role-USER    { background: var(--secondary-color); }
            .me-badge { font-size: 11px; background: var(--primary-color); color: var(--white-color); padding: 2px 8px; border-radius: 10px; }
            .role-select { width: auto; display: inline-block; padding: 4px 28px 4px 10px; font-size: 14px; }
            .btn-sm-custom { padding: 4px 12px; font-size: 14px; border-radius: var(--border-radius-small); }
        </style>
    </head>

    <body>
        <!-- 관리자 상단 영역 -->
        <header class="admin-header">
            <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <a th:href="@{/}" class="small"><i class="bi-house me-1"></i>메인으로</a>
                    <h1 class="mt-1"><i class="bi-shield-lock me-2"></i>회원 관리</h1>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <!-- sec:authentication="name" : 로그인 아이디 / principal.authorities : 내 권한 목록 -->
                    <span><i class="bi-person-circle me-1"></i><strong sec:authentication="name">admin</strong>님
                        <code class="ms-1 text-white" sec:authentication="principal.authorities">[ROLE_ADMIN]</code></span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-light btn-sm-custom"><i class="bi-box-arrow-right me-1"></i>로그아웃</button>
                    </form>
                </div>
            </div>
        </header>

        <main class="admin-body">
            <div class="container">

                <!-- 회원 통계 : ${members} = 컨트롤러가 넘겨준 회원 목록 -->
                <!-- members.?[조건] : 목록에서 조건에 맞는 것만 골라내기 (SpEL 선택 문법) -->
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <div class="admin-card stat-card">
                            <div class="stat-icon" style="background: var(--primary-color);"><i class="bi-people"></i></div>
                            <div>
                                <div class="stat-num" th:text="${#lists.size(members)}">0</div>
                                <div class="stat-label">전체 회원</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="admin-card stat-card">
                            <div class="stat-icon role-ADMIN"><i class="bi-shield-check"></i></div>
                            <div>
                                <div class="stat-num" th:text="${members.?[role == 'ADMIN'].size()}">0</div>
                                <div class="stat-label">관리자 (ADMIN)</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="admin-card stat-card">
                            <div class="stat-icon role-USER"><i class="bi-person"></i></div>
                            <div>
                                <div class="stat-num" th:text="${members.?[role != 'ADMIN'].size()}">0</div>
                                <div class="stat-label">일반 회원 (USER · MANAGER)</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 처리 결과 메시지 : 컨트롤러에서 redirect.addFlashAttribute("message" / "error", ...) -->
                <div th:if="${message}" class="alert alert-success py-2" role="alert">
                    <i class="bi-check-circle me-1"></i> <span th:text="${message}">성공 메시지</span>
                </div>
                <div th:if="${error}" class="alert alert-danger py-2" role="alert">
                    <i class="bi-exclamation-circle me-1"></i> <span th:text="${error}">에러 메시지</span>
                </div>

                <!-- 회원 목록 -->
                <div class="admin-card">
                    <h5 class="mb-3"><i class="bi-list-ul me-2"></i>회원 목록</h5>
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>번호</th><th>아이디</th><th>이름</th><th>권한</th><th>권한 변경</th><th>삭제</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="m : ${members}">
                                    <td th:text="${m.id}">1</td>
                                    <td>
                                        <span th:text="${m.username}">student1</span>
                                        <!-- #authentication.name : 로그인한 내 아이디 → 내 계정 표시 -->
                                        <span th:if="${m.username == #authentication.name}" class="me-badge ms-1">나</span>
                                    </td>
                                    <td th:text="${m.name}">홍길동</td>
                                    <td><span class="role-badge" th:classappend="'role-' + ${m.role}" th:text="${m.role}">USER</span></td>
                                    <td>
                                        <!-- 권한 변경 : POST /admin/members/{id}/role , 파라미터 role -->
                                        <form th:action="@{/admin/members/{id}/role(id=${m.id})}" method="post" class="d-flex gap-2 m-0">
                                            <select name="role" class="form-select role-select">
                                                <option value="USER" th:selected="${m.role == 'USER'}">USER</option>
                                                <option value="MANAGER" th:selected="${m.role == 'MANAGER'}">MANAGER</option>
                                                <option value="ADMIN" th:selected="${m.role == 'ADMIN'}">ADMIN</option>
                                            </select>
                                            <button type="submit" class="btn btn-outline-primary btn-sm-custom">변경</button>
                                        </form>
                                    </td>
                                    <td>
                                        <!-- 회원 삭제 : POST /admin/members/{id}/delete -->
                                        <form th:action="@{/admin/members/{id}/delete(id=${m.id})}" method="post" class="m-0"
                                              onsubmit="return confirm('정말 삭제하시겠습니까?');">
                                            <button type="submit" class="btn btn-outline-danger btn-sm-custom"><i class="bi-trash"></i></button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <p class="text-muted small mt-3 mb-0">
                        <i class="bi-info-circle me-1"></i>권한이 바뀐 회원은 <strong>다시 로그인</strong>해야 새 권한이 적용됩니다.
                    </p>
                </div>

            </div>
        </main>
    </body>
</html>
